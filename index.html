<!doctype html><html><head><meta charset="utf-8"><title>End-Effector Generator</title>
<style>
body{--bg:#1e1f22;--fg:#e6e6e6;--line:#3a3b3f;--chip:#2b2c30;background:var(--bg);color:var(--fg);margin:0;font:14px system-ui,sans-serif;display:flex;height:100vh;}body.light{--bg:#fff;--fg:#222;--line:#ddd;--chip:#eee}
#side{width:340px;overflow:auto;padding:12px;border-right:1px solid var(--line);box-sizing:border-box}
#view{flex:1;position:relative}#view canvas{display:block}
#steps{display:flex;gap:4px;margin-bottom:10px}#steps span{flex:1;padding:6px 2px;text-align:center;background:var(--chip);font-size:11px;border-radius:4px}
#steps .on{background:var(--fg);color:var(--bg)}.row{margin:9px 0}.row label{display:block;font-weight:600;margin-bottom:2px}
.row .rec{font-size:11px;color:#777}.row input[type=range]{width:68%}.row input[type=number]{width:22%}
.ok{color:#1a7f37}.warn{color:#b35900}.bad{color:#c62828}select{width:100%}
#msg{margin-top:10px;font-size:12px}#msg div{margin:3px 0}button{margin:3px 3px 0 0;padding:6px 10px;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:4px}select,input{background:var(--chip);color:var(--fg);border:1px solid var(--line)}dialog{background:var(--bg);color:var(--fg)}
#status{position:absolute;top:8px;left:8px;background:var(--chip);padding:4px 8px;border-radius:4px}
#steps span[data-s]{cursor:pointer}.off{opacity:.35;pointer-events:none}dialog{max-width:360px}dialog label{display:block;margin:6px 0}dialog input,dialog select{width:100%;box-sizing:border-box}
#adv{margin:-4px 0 8px}#steps span[data-s]{position:relative}#steps .st{position:absolute;top:-6px;right:-3px;flex:none;padding:0;background:none;font-size:11px;text-shadow:0 0 3px var(--bg)}#next{margin-top:16px;padding-top:8px;border-top:1px solid var(--line)}#next .warn{font-size:12px;margin-bottom:4px}#next button{width:100%;padding:8px;font-weight:700}.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}.switch input{display:none}
.knob{position:relative;width:30px;height:16px;border-radius:8px;background:var(--line);flex:none;transition:background .15s}.knob::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--fg);transition:left .15s}
.switch input:checked+.knob{background:#2f7de1}.switch input:checked+.knob::after{left:16px}
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border-radius:50%;border:1px solid var(--line);font-size:10px;font-weight:700;cursor:help;opacity:.75;vertical-align:middle}.help:hover,.help:focus{opacity:1}
.tip{position:fixed;z-index:20;display:none;background:var(--chip);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:0 4px 14px #0006}
.sec-head{display:flex;align-items:center;gap:6px;font-weight:700;margin:14px 0 4px;cursor:pointer}.sec-arrow{transition:transform .15s}.sec.closed .sec-arrow{transform:rotate(-90deg)}.sec.closed .sec-body{display:none}
.seg{display:flex}.seg button{flex:1;margin:0;border-radius:0}.seg button:first-child{border-radius:4px 0 0 4px}.seg button:last-child{border-radius:0 4px 4px 0}.seg button:disabled{opacity:.4;cursor:not-allowed}.seg button.on{background:var(--fg);color:var(--bg)}
</style></head><body>
<div id="side"><div id="steps"><span class="on" data-s="A">1 Robot side</span><span data-s="B">2 Tool</span><span data-s="C">3 Connector</span><span data-s="D">4 Export</span></div><div id="adv"></div>
<div id="controls"></div><div id="msg"></div>
<div id="exportA"><b>Export robot side</b><br><button data-f="step">STEP</button><button data-f="stl">STL</button><button data-f="3mf">3MF</button></div><div id="next"></div></div>
<div id="view"><div id="status">Loading geometry engine…</div></div>
<script type="module" src="/src/main.js"></script></body></html>
